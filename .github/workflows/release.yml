name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^let version = "\(.*\)"$/\1/p' skhd-hud.swift)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $v in skhd-hud.swift"
            exit 1
          fi

      - name: Build universal binary
        run: |
          set -euo pipefail
          mkdir -p build
          for arch in arm64 x86_64; do
            swiftc -O -target "$arch-apple-macos12" skhd-hud.swift -o "build/skhd-hud-$arch"
          done
          lipo -create -output build/skhd-hud build/skhd-hud-arm64 build/skhd-hud-x86_64
          codesign --force --sign - build/skhd-hud
          lipo -info build/skhd-hud
          ./build/skhd-hud --version

      - name: Package
        run: |
          set -euo pipefail
          cd build
          zip skhd-hud-macos-universal.zip skhd-hud
          shasum -a 256 skhd-hud-macos-universal.zip > skhd-hud-macos-universal.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skhd-hud
          path: build/skhd-hud-macos-universal.zip*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/skhd-hud-macos-universal.zip \
            build/skhd-hud-macos-universal.zip.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
